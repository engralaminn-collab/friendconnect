# FriendConnect — Coturn TURN Server Configuration
# Deploy to: /etc/turnserver.conf
# Docs: https://github.com/coturn/coturn

# ---- Network ----
# The public IP address of the TURN server (REQUIRED — set to your server's public IP)
# external-ip=YOUR_PUBLIC_IP

# Listening IP (0.0.0.0 = all interfaces)
listening-ip=0.0.0.0

# ---- Ports ----
# UDP/TCP listening port
listening-port=3478

# TLS listening port (for turns:)
tls-listening-port=5349

# ---- Realm ----
# Must match TURN_REALM in FriendConnect .env
realm=friendconnect

# ---- Authentication ----
# Use long-term credential mechanism
lt-cred-mech

# Static credentials (for quick setup — prefer TURN_SECRET for production)
# Set these to match TURN_USERNAME + TURN_PASSWORD in FriendConnect .env
# user=friendconnect:CHANGE_ME_TURN_PASSWORD

# REST API credentials (time-limited — more secure, recommended for production)
# Set TURN_SECRET in FriendConnect .env to the same value
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET

# ---- Certificates (for turns: / TLS) ----
# Generate with: openssl req -x509 -newkey rsa:2048 -keyout turn_key.pem -out turn_cert.pem -days 365 -nodes
# cert-file=/etc/turn_cert.pem
# pkey-file=/etc/turn_key.pem

# ---- Performance / Limits ----
# Max allocations per user
max-allocations-per-user=10

# Bandwidth limit (bytes per second) — 1MB/s per allocation
# bps-capacity=1000000

# Total quota (bytes) — 1GB per user
# total-quota=1073741824

# Max sessions
max-bps=10000000

# ---- Logging ----
log-file=/var/log/turnserver.log
simple-log
verbose

# ---- Security ----
# Prevent fingerprinting
fingerprint

# Prevent relay to private IP ranges (prevents SSRF)
no-loopback-peers
no-multicast-peers

# Block traffic to common metadata endpoints
# denied-peer-ip=169.254.0.0/16
# denied-peer-ip=127.0.0.0/8

# ---- Mobility (helps with WiFi↔Mobile Data transitions) ----
mobility

# ---- CLI ----
# cli-password=CHANGE_ME_CLI_PASSWORD
