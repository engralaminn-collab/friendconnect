# FriendConnect — continuous integration
#
# Single source of truth for verification: install, typecheck the app, typecheck
# the test suite, run the test suite, and build the Next.js app. The custom
# Socket.IO server is built as a smoke check so a broken server bundle cannot
# reach main.
#
# Integration tests never fake a pass: HTTP/Socket.IO suites skip honestly when
# no server is reachable (FC_BASE_URL unset), unit suites always run.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      # Prisma schema needs a URL even for `prisma generate`.
      DATABASE_URL: file:./prisma/dev.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare Prisma client
        run: npx prisma generate

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Type-check test suite
        run: npm run test:types

      - name: Build Socket.IO server bundle
        run: npm run build:server

      - name: Run tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
