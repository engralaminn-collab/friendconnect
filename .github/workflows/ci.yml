name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Type-check test suite
        run: npm run test:types

      # Unit suites always run; HTTP/WS integration suites skip honestly
      # (never fake-pass) when no server is reachable on FC_BASE_URL.
      - name: Run tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

      - name: Bundle custom realtime server
        run: npm run build:server
